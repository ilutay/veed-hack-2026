name: educational-video
description: Generate educational video content from a topic using Codex skills, subagents, APIs, and MCP tools.
version: 0.1.0

inputs:
  topic:
    type: string
    required: true
    description: The subject the learner wants to understand.
  learner_profile:
    type: object
    required: false
    description: Optional level, audience, tone, constraints, and preferred duration.
  output_dir:
    type: string
    required: false
    default: artifacts/educational-video

contracts:
  research_brief: ../contracts/research-brief.schema.json
  taste_profile: ../contracts/taste-profile.schema.json
  lesson_script: ../contracts/lesson-script.schema.json
  asset_manifest: ../contracts/asset-manifest.schema.json
  webpage_build: ../contracts/webpage-build.schema.json

stages:
  - id: topic_research
    agent: ../subagents/topic-research-agent.md
    skill: ../skills/topic-research
    mode: sequential
    input:
      - topic
      - learner_profile
      - taste-profile.json
    output:
      - research-brief.json

  - id: research_script
    agent: ../subagents/research-script-agent.md
    skill: ../skills/topic-research-script
    mode: sequential
    depends_on:
      - topic_research
    input:
      - research-brief.json
      - topic
      - learner_profile
    output:
      - lesson_script.json
      - sources.json

  - id: content_generation
    mode: parallel
    depends_on:
      - research_script
    concurrency: >
      Launch every branch below in the same turn lesson_script.json is
      written, each as its own subagent (Agent tool) — never run one branch
      to completion before starting another. talking_head_intro in
      particular is the long pole (VEED render, ~1-2 min); starting it after
      the fal branch finishes roughly doubles this stage's wall-clock time
      for no benefit, since no branch reads another's output. See
      ../skills/educational-video-workflow/references/workflow-contract.md.
    branches:
      - id: talking_head_intro
        agent: ../subagents/talking-head-agent.md
        skill: ../skills/veed-talking-head
        output:
          - talking-head-intro-audio.mp3
          - talking-head-intro.mp4
          - talking-head-metadata.json
      - id: slide_images
        agent: ../subagents/slide-image-agent.md
        skill: ../skills/slide-image-generation
        fan_out: slides
        max_parallel: 6
        output:
          - slide-images/*.png
          - slide-image-prompts.json
      - id: voiceover_video
        agent: ../subagents/voiceover-agent.md
        skill: ../skills/voiceover-video-generation
        output:
          - voiceover.mp3
          - narration-timings.json

  - id: assemble_webpage
    agent: ../subagents/page-assembly-agent.md
    skill: ../skills/learning-page-assembly
    mode: sequential
    depends_on:
      - content_generation
    input:
      - lesson_script.json
      - talking-head-intro.mp4
      - slide-images/*.png
      - voiceover.mp3
      - narration-timings.json
    output:
      - index.html
      - assets/**
      - webpage-build.json

api_boundaries:
  - Do not call paid or mutating provider APIs unless credentials and an explicit run mode are configured.
  - Prefer dry-run MCP/API contract tests while schemas and providers are still evolving.
  - Persist every external response or normalized provider artifact under the stage output directory for replay.

artifact_layout:
  root: artifacts/educational-video/{run_id}
  stage_dirs:
    topic_research: 00-topic-research
    research_script: 01-research-script
    content_generation: 02-content-generation
    assemble_webpage: 03-webpage
